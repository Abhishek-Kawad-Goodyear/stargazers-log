<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A curated log of starred repositories.">
    <title>Starred repositories</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="container">
      <header class="page-header">
        <p class="eyebrow">Personal developer log</p>
        <h1>Starred repositories</h1>
        <p class="intro">A log of the repositories I've starred, collected in one place.</p>
      </header>

      <section aria-labelledby="repositories-heading">
        <div class="section-heading">
          <h2 id="repositories-heading">Recently starred</h2>
          <span id="repository-count" class="count" aria-live="polite"></span>
        </div>
        <div id="repository-list" class="repository-list" aria-live="polite">
          <p class="status">Loading starred repositories…</p>
        </div>
      </section>
    </main>
  </body>
</html>
